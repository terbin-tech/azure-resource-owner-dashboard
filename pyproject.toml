[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-resource-owner-dashboard"
description = "Read-only dashboard: who has what running in a shared Azure course subscription"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "azure-identity==1.27.0",
    "azure-core==1.41.0",
    "azure-mgmt-resourcegraph==8.0.1",
    "azure-mgmt-resource==26.0.0",
    "azure-mgmt-resource-subscriptions==1.0.0",
    "azure-mgmt-monitor==7.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "pre-commit==4.7.0"]

[tool.setuptools.dynamic]
version = { attr = "dashboard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "D205", "D209"]  # D: PEP 257 docstring layout
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
