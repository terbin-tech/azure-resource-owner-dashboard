# No Azure access, by design: the maintainer deploys from their own machine, so CI has no OIDC
# federation, no id-token permission and no Azure secrets or variables.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: pre-commit, manual stage (every hook but the local denylist ones, plus a gitleaks scan of the whole history)
        run: pre-commit run --all-files --show-diff-on-failure --hook-stage manual
      - name: pytest
        run: pytest
